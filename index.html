<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>機器人研究社 - 幹介照片徵稿</title>
  
  <!-- 導入 Google Fonts (DotGothic16 點陣像素字體 + Share Tech Mono 科技字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #121620;
      --accent-color: #ff4d00;
      --accent-hover: #e04400;
      --text-main: #f0f2f5;
      --text-muted: #808c9e;
      --border-color: #262c3a;
      --input-bg: #0a0d14;
      --success-color: #00e676;
      --error-color: #ff3d00;
      
      --font-pixel: 'DotGothic16', monospace, sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    /* 像素字體與渲染設定 */
    body, input, select, textarea, button {
      font-family: var(--font-pixel);
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
    }

    html, body {
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start; /* 改為靠頂，解決下方大量留白 */
      padding: 40px 16px;
      position: relative;
    }

    /* 背景點陣線條 */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at 50% 20%, rgba(255, 77, 0, 0.04) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 24px 24px, 24px 24px;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-top: 3px solid var(--accent-color);
      border-radius: 4px;
      padding: 28px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #d1d7e0;
    }

    label span.req {
      color: var(--accent-color);
    }

    select, textarea, input[type="file"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 2px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, textarea:focus, input[type="file"]:focus {
      border-color: var(--accent-color);
    }

    option {
      background-color: #161b24;
      color: var(--text-main);
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* 檔案選擇器風格 */
    input[type="file"]::file-selector-button {
      font-family: var(--font-pixel);
      background: #202634;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 2px;
      cursor: pointer;
      margin-right: 10px;
    }

    input[type="file"]::file-selector-button:hover {
      background: #2b3346;
    }

    .file-hint {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background-color 0.2s;
      margin-top: 4px;
    }

    .submit-btn:hover {
      background-color: var(--accent-hover);
    }

    .submit-btn:disabled {
      background-color: #282d38;
      color: #586070;
      cursor: not-allowed;
    }

    /* 內嵌訊息框 */
    .inline-msg {
      display: none;
      padding: 10px 14px;
      border-radius: 2px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .inline-msg.success {
      display: block;
      background-color: rgba(0, 230, 118, 0.1);
      border: 1px solid var(--success-color);
      color: var(--success-color);
    }

    .inline-msg.error {
      display: block;
      background-color: rgba(255, 61, 0, 0.1);
      border: 1px solid var(--error-color);
      color: var(--error-color);
    }

    /* 進度條容器 */
    #progressContainer {
      display: none;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
    }

    .status-msg {
      font-size: 13px;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: var(--input-bg);
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent-color);
      transition: width 0.2s ease;
    }

    /* 📱 手機專屬響應式調整 (RWD) */
    @media (max-width: 600px) {
      body {
        padding: 16px 10px; /* 減小手機頁面邊距 */
      }

      .container {
        padding: 20px 16px; /* 緊湊手機卡片內距 */
      }

      h1 {
        font-size: 19px;
      }

      p.subtitle {
        font-size: 12px;
      }

      label {
        font-size: 13px;
      }

      select, textarea, input[type="file"] {
        padding: 8px 10px;
        font-size: 13px;
      }

      input[type="file"]::file-selector-button {
        padding: 4px 8px;
        font-size: 12px;
      }

      .submit-btn {
        padding: 11px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="tag">ROBOTICS CLUB</div>
    <h1>幹介照片投稿系統</h1>
    <p class="subtitle">請選擇幹部對象並上傳個人照或活動照片</p>
  </div>

  <div id="inlineMsg" class="inline-msg"></div>

  <form id="uploadForm">
    <!-- 1. 下拉選單 (20 位幹部) -->
    <div class="form-group">
      <label for="personSelect">投稿幹部對象 <span class="req">*</span></label>
      <select id="personSelect" required>
        <option value="">-- 請選擇幹部 --</option>
        <option value="社長">社長</option>
        <option value="副社長">副社長</option>
        <option value="教學">教學</option>
        <option value="機構組長">機構組長</option>
        <option value="電控組長">電控組長</option>
        <option value="程式組長">程式組長</option>
        <option value="公關">公關</option>
        <option value="網管">網管</option>
        <option value="總務">總務</option>
        <option value="美宣">美宣</option>
        <option value="活動">活動</option>
        <option value="器材">器材</option>
        <option value="幹部A">幹部 A</option>
        <option value="幹部B">幹部 B</option>
        <option value="幹部C">幹部 C</option>
        <option value="幹部D">幹部 D</option>
        <option value="幹部E">幹部 E</option>
        <option value="幹部F">幹部 F</option>
        <option value="幹部G">幹部 G</option>
        <option value="幹部H">幹部 H</option>
      </select>
    </div>

    <!-- 2. 說明與事蹟 -->
    <div class="form-group">
      <label for="storyText">說明與事蹟（選填）</label>
      <textarea id="storyText" placeholder="填寫關於這些照片的說明、事蹟或備註..."></textarea>
    </div>

    <!-- 3. 照片檔案上傳 -->
    <div class="form-group">
      <label for="photoInput">上傳照片 <span class="req">*</span></label>
      <input type="file" id="photoInput" accept="image/*" multiple required>
      <div class="file-hint">SUPPORT MULTIPLE FILES (JPG, PNG)</div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">開始上傳照片</button>
  </form>

  <div id="progressContainer">
    <div class="status-msg" id="statusMsg">準備上傳中...</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<script>
  // ⚠️ 請填入你在 Google Apps Script 取得的 Web App 部署網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxzLGbJlFiXg1GQ7mPQc1hgbVjPdXnjIjbSZXapyXHfsB0-iVRTK2c4rV3xe5-sCbQ/exec";

  const form = document.getElementById('uploadForm');
  const submitBtn = document.getElementById('submitBtn');
  const progressContainer = document.getElementById('progressContainer');
  const statusMsg = document.getElementById('statusMsg');
  const progressFill = document.getElementById('progressFill');
  const inlineMsg = document.getElementById('inlineMsg');

  function showMsg(type, text) {
    inlineMsg.className = `inline-msg ${type}`;
    inlineMsg.innerText = text;
  }

  function hideMsg() {
    inlineMsg.className = "inline-msg";
    inlineMsg.innerText = "";
  }

  const fileToBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();

    if (!GAS_URL || GAS_URL.includes("你的_GOOGLE_APPS_SCRIPT")) {
      showMsg('error', '⚠️ 尚未設定 Google Apps Script 網址，請先修改程式碼！');
      return;
    }

    const person = document.getElementById('personSelect').value;
    const story = document.getElementById('storyText').value;
    const files = document.getElementById('photoInput').files;

    if (files.length === 0) {
      showMsg('error', '⚠️ 請至少選取一張照片！');
      return;
    }

    submitBtn.disabled = true;
    progressContainer.style.display = "block";
    statusMsg.innerText = "正在連線雲端資料夾...";
    progressFill.style.width = "0%";

    try {
      const initRes = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "initSubmission",
          person: person,
          story: story,
          photoCount: files.length
        })
      }).then(res => res.json());

      if (initRes.status !== "success") throw new Error(initRes.message);

      const folderId = initRes.folderId;
      const totalFiles = files.length;

      for (let i = 0; i < totalFiles; i++) {
        const file = files[i];
        statusMsg.innerText = `正在上傳 (${i + 1}/${totalFiles})：${file.name}`;

        const base64Data = await fileToBase64(file);

        const uploadRes = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "uploadFile",
            folderId: folderId,
            fileName: file.name,
            fileType: file.type,
            fileData: base64Data
          })
        }).then(res => res.json());

        if (uploadRes.status !== "success") throw new Error(uploadRes.message);

        const percent = Math.round(((i + 1) / totalFiles) * 100);
        progressFill.style.width = percent + "%";
      }

      statusMsg.innerText = "✓ 所有檔案傳送完成！";
      showMsg('success', '🎉 上傳成功！照片已成功儲存至 Google Drive 幹部專屬資料夾。');
      form.reset();

    } catch (err) {
      console.error(err);
      statusMsg.innerText = "✕ 上傳失敗";
      showMsg('error', '❌ 上傳發生錯誤：' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
